# What this mirror (claude-hamikaki) backs up. Same format in every mirror repo.
# One item per line, paths relative to the projects root, '#' starts a comment.
#   [claude]   folders: only their Claude files (+ helper scripts, see [scripts])
#   [whole]    folders: every text file
#   [files]    single files at the projects root
#   [exclude]  folders skipped entirely
#   [scripts]  helper-script extensions to include in [claude] folders, outside nested git repos

[claude]
codes
noncodes

[exclude]
codes/pricefx            # backed up by claude-rnd4u

[scripts]
py ps1 sh groovy bat cmd js

[whole]
_launcher

[files]
CLAUDE.md
Launch.cmd
Launch.command
launch.sh
